openapi: 3.0.3
info:
  title: Agentfence
  version: 0.1.0
  description: >-
    Identity, audit, and autonomy-boundary control plane for autonomous AI agents
    in decentralised marketplaces — bot identity, audit trails, limits, kill-switch.
  x-product-slug: ai-decentralized-agentfence
  x-source: ai-in-decentralized+ai/aiblockchainmattturck06282018final-180718222409/
servers:
  - url: https://api.example.com
tags:
  - name: Agents
    description: Agent identity registration and marketplace ID mapping
  - name: Policies
    description: Autonomy boundaries and delegation rules
  - name: Audits
    description: Tamper-evident action audit trail
  - name: KillSwitch
    description: Containment and halt orders for agent trees
  - name: AddOns
    description: Allowlisted bot extension marketplace
  - name: Reporting
    description: Compliance and incident exports
paths:
  /v1/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, killed]
      responses:
        "200":
          description: Agents page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAgentIdentity"
    post:
      operationId: registerAgent
      tags: [Agents]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegister"
      responses:
        "201":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAgentIdentity"
  /v1/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgent
      tags: [Agents]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Agent identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAgentIdentity"
  /v1/policies:
    get:
      operationId: listAutonomyPolicies
      tags: [Policies]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Policies page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAutonomyPolicy"
    post:
      operationId: createAutonomyPolicy
      tags: [Policies]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyPolicyCreate"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAutonomyPolicy"
  /v1/policies/evaluate:
    post:
      operationId: evaluateAgentAction
      tags: [Policies]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionEvaluationRequest"
      responses:
        "200":
          description: Allow or deny decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeActionDecision"
        "403":
          description: Action denied by boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/audits/events:
    get:
      operationId: listAuditEvents
      tags: [Audits]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: agentId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAuditEvent"
    post:
      operationId: appendAuditEvent
      tags: [Audits]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditEventCreate"
      responses:
        "201":
          description: Event appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAuditEvent"
  /v1/kill-switch/orders:
    post:
      operationId: invokeKillSwitch
      tags: [KillSwitch]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchOrderCreate"
      responses:
        "202":
          description: Kill-switch propagating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeKillSwitchOrder"
  /v1/kill-switch/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getKillSwitchOrder
      tags: [KillSwitch]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Kill-switch order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeKillSwitchOrder"
  /v1/add-ons:
    get:
      operationId: listAddOnPackages
      tags: [AddOns]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, blocked]
      responses:
        "200":
          description: Add-on packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAddOnPackage"
    post:
      operationId: submitAddOnPackage
      tags: [AddOns]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOnPackageCreate"
      responses:
        "201":
          description: Add-on submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAddOnPackage"
  /v1/reports/compliance:
    get:
      operationId: getComplianceExport
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Compliance bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeComplianceExport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    AgentIdentity:
      type: object
      required: [id, enterpriseId, status]
      properties:
        id: { type: string }
        enterpriseId: { type: string }
        marketplaceIds: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [active, suspended, killed] }
        parentAgentId: { type: string }
    AgentRegister:
      type: object
      required: [enterpriseId, runtimeType]
      properties:
        enterpriseId: { type: string }
        runtimeType: { type: string, enum: [fetch_aea, singularitynet, internal] }
        parentAgentId: { type: string }
        marketplaceExternalId: { type: string }
    AutonomyPolicy:
      type: object
      required: [id, agentId]
      properties:
        id: { type: string }
        agentId: { type: string }
        maxSpendPerDay: { type: number, format: double }
        allowedTools: { type: array, items: { type: string } }
        maxSubAgentDepth: { type: integer }
        prohibitedDomains: { type: array, items: { type: string } }
    AutonomyPolicyCreate:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        maxSpendPerDay: { type: number, format: double }
        allowedTools: { type: array, items: { type: string } }
        maxSubAgentDepth: { type: integer }
    ActionEvaluationRequest:
      type: object
      required: [agentId, actionType]
      properties:
        agentId: { type: string }
        actionType: { type: string }
        toolName: { type: string }
        estimatedCost: { type: number, format: double }
        modelProvenance: { type: string }
    ActionDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        escalationRequired: { type: boolean }
    AuditEvent:
      type: object
      required: [id, agentId, actionType, occurredAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        actionType: { type: string }
        outcome: { type: string, enum: [allowed, denied] }
        recordHash: { type: string }
        occurredAt: { type: string, format: date-time }
    AuditEventCreate:
      type: object
      required: [agentId, actionType, outcome]
      properties:
        agentId: { type: string }
        actionType: { type: string }
        outcome: { type: string }
        detailRef: { type: string }
    KillSwitchOrder:
      type: object
      properties:
        id: { type: string }
        rootAgentId: { type: string }
        status: { type: string, enum: [propagating, completed, failed] }
        includeSubAgents: { type: boolean }
        invokedAt: { type: string, format: date-time }
    KillSwitchOrderCreate:
      type: object
      required: [rootAgentId, rationale]
      properties:
        rootAgentId: { type: string }
        rationale: { type: string }
        includeSubAgents: { type: boolean, default: true }
    AddOnPackage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [pending, approved, blocked] }
        attestationRef: { type: string }
    AddOnPackageCreate:
      type: object
      required: [name, version, artifactRef]
      properties:
        name: { type: string }
        version: { type: string }
        artifactRef: { type: string }
    ComplianceExport:
      type: object
      properties:
        agentId: { type: string }
        period: { type: string }
        auditEventCount: { type: integer }
        deniedActions: { type: integer }
        killSwitchInvocations: { type: integer }
    DataEnvelopeAgentIdentity:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AgentIdentity" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeAutonomyPolicy:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AutonomyPolicy" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeActionDecision:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ActionDecision" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeAuditEvent:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AuditEvent" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeKillSwitchOrder:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/KillSwitchOrder" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeAddOnPackage:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AddOnPackage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeComplianceExport:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ComplianceExport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAgentIdentity:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AgentIdentity" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAutonomyPolicy:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AutonomyPolicy" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAuditEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAddOnPackage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AddOnPackage" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
