openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed
    AgentId:
      type: string
      description: Prefixed agent identity id (`agt_…`).
      pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
    PolicyId:
      type: string
      description: Prefixed autonomy policy id (`pol_…`).
      pattern: '^pol_[0-9A-HJKMNP-TV-Z]{26}$'
    AuditEventId:
      type: string
      description: Prefixed audit event id (`aud_…`).
      pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
    KillSwitchOrderId:
      type: string
      description: Prefixed kill-switch order id (`ksw_…`).
      pattern: '^ksw_[0-9A-HJKMNP-TV-Z]{26}$'
    AddOnId:
      type: string
      description: Prefixed add-on package id (`ado_…`).
      pattern: '^ado_[0-9A-HJKMNP-TV-Z]{26}$'
    DelegationId:
      type: string
      description: Prefixed delegation edge id (`dlg_…`).
      pattern: '^dlg_[0-9A-HJKMNP-TV-Z]{26}$'
    IncidentId:
      type: string
      description: Prefixed incident id (`inc_…`).
      pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
    ReportId:
      type: string
      description: Prefixed compliance report id (`rpt_…`).
      pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$'
    AdapterId:
      type: string
      description: Prefixed marketplace adapter id (`mkt_…`).
      pattern: '^mkt_[0-9A-HJKMNP-TV-Z]{26}$'
